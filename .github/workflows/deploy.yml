name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A broken money calculation should never reach the phone.
      - run: npm test

      - run: npm run build
        env:
          # Project sites live under /<repo>, and every URL in the app has to
          # agree with that. Change this if the repo is ever renamed.
          NEXT_PUBLIC_BASE_PATH: /budget-app

      # Without this, Pages runs Jekyll, which ignores the _next directory
      # and serves a blank page.
      - run: touch out/.nojekyll

      # Pages itself has to be switched on once by hand, under
      # Settings -> Pages -> Source: GitHub Actions. The workflow token is not
      # allowed to create the site, only to publish to an existing one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
